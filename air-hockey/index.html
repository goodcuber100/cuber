<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Puck Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0f1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root {
  /* Layout: a full-bleed arcade table is the whole screen; menus are slab panels laid over a live attract-mode game. */
  --night: #0a0f1f;
  --night-hi: #18224a;
  --rail: #151d38;
  --rail-hi: #3a4c8a;
  --panel: #111936;
  --panel-edge: #2b3a70;
  --ice: #f1f7fa;
  --ice-shade: #d6e5ed;
  --hole: rgba(38, 64, 92, 0.16);
  --gloss: rgba(255, 255, 255, 0.4);
  --gloss-0: rgba(255, 255, 255, 0);
  --shadow: rgba(8, 16, 36, 0.28);
  --spec: rgba(255, 255, 255, 0.6);
  --ink: #eaf0ff;
  --muted: #93a0c9;
  --red: #ff4659;
  --red-deep: #b3132b;
  --red-soft: #ffa3ad;
  --blue: #2d8bff;
  --blue-deep: #0f4fb0;
  --blue-soft: #a5ccff;
  --puck: #ffcf2e;
  --puck-body: #161a24;
  --line: #e0354a;
  --pu-ink: #0d1430;
  --pu-turbo: #ffab1f;
  --pu-giant: #2fd4a0;
  --pu-shield: #58ccff;
  --pu-double: #ff6ad5;
  --pu-extra: #a6e22e;
  --pu-ghost: #c3b3ff;
  --font-display: "Bungee", "Arial Black", Impact, sans-serif;
  --font-ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#safe {
  position: fixed; inset: 0; pointer-events: none; visibility: hidden;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--puck); outline-offset: 2px; }

.icon-btn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: calc(env(safe-area-inset-right, 0px) + 10px);
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--panel-edge);
  background: color-mix(in srgb, var(--panel) 80%, transparent);
  display: grid; place-items: center;
  z-index: 5;
}
.icon-btn span { display: flex; gap: 5px; }
.icon-btn span::before, .icon-btn span::after { content: ""; width: 5px; height: 16px; border-radius: 2px; background: var(--ink); }

#banner {
  position: fixed; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-display);
  font-size: clamp(44px, 11vmin, 120px);
  color: var(--c, var(--ink));
  text-shadow: 0 4px 0 var(--night), 0 0 40px var(--c, var(--ink));
  pointer-events: none; opacity: 0; z-index: 4; white-space: nowrap;
}
#banner.show { animation: pop 1.1s cubic-bezier(.2, .9, .3, 1.2) forwards; }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
  18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  30% { transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.04); }
}
#toast {
  position: fixed; left: 50%; top: 50%;
  transform: translate(-50%, calc(clamp(44px, 11vmin, 120px) * .9));
  max-width: min(88vw, 420px);
  padding: 8px 14px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--night) 82%, transparent);
  border: 1px solid var(--c, var(--panel-edge));
  font-weight: 600; font-size: 14px; text-align: center;
  pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 4;
}
#toast b { color: var(--c, var(--ink)); font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
#toast.show { opacity: 1; }

.overlay {
  position: fixed; inset: 0;
  display: flex;
  overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--night) 55%, transparent);
  z-index: 6;
}
#menu { background: radial-gradient(ellipse at center, color-mix(in srgb, var(--night) 55%, transparent), color-mix(in srgb, var(--night) 88%, transparent)); }
.menu-inner { margin: auto; width: 100%; max-width: 780px; display: grid; gap: 18px; }
.brand { text-align: center; display: grid; gap: 4px; }
.logo {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(40px, 10vw, 80px);
  line-height: 1;
  letter-spacing: .02em;
  color: var(--ink);
  text-shadow: 3px 3px 0 var(--red), -3px -3px 0 var(--blue);
  text-wrap: balance;
}
.tag { margin: 6px 0 0; color: var(--muted); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }

.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.mode {
  display: grid; gap: 6px; align-content: start;
  text-align: left;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--panel-edge);
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  transition: transform .15s, border-color .15s;
}
.mode:hover { transform: translateY(-2px); border-color: var(--ink); }
.mode svg { width: 100%; height: auto; max-height: 120px; display: block; margin-bottom: 4px; }
.mode-name { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mode-name small { font-family: var(--font-ui); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--puck); }
.mode-desc { color: var(--muted); font-size: 15px; line-height: 1.4; }
.mode-go { margin-top: 4px; font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.ill-rail { fill: var(--rail); stroke: var(--rail-hi); stroke-width: 1.5; }
.ill-ice { fill: var(--ice); }
.ill-line { stroke: var(--line); stroke-width: 2; fill: none; }
.ill-red { fill: var(--red); }
.ill-red-soft { fill: var(--red-soft); }
.ill-blue { fill: var(--blue); }
.ill-blue-soft { fill: var(--blue-soft); }
.ill-puck { fill: var(--puck-body); stroke: var(--puck); stroke-width: 2; }
.ill-motion { stroke: var(--muted); stroke-width: 2.5; stroke-linecap: round; fill: none; }
.ill-band { stroke: var(--red-deep); stroke-width: 2; fill: none; }
.ill-aim { stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 2 5; stroke-linecap: round; fill: none; }
.ill-pu { fill: var(--pu-turbo); }
.ill-pu2 { fill: var(--pu-double); }
.ill-ink { fill: var(--pu-ink); }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px 18px; }
.opt { display: grid; gap: 6px; min-width: 0; }
.opt-label { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: color-mix(in srgb, var(--night) 70%, transparent); border: 1px solid var(--panel-edge); }
.seg button {
  flex: 1 1 auto;
  min-height: 36px;
  padding: 6px 10px;
  border: 0; border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-weight: 600; font-size: 14px;
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--night); }
.note { margin: 0; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
.note kbd { font-family: var(--font-ui); font-weight: 700; color: var(--ink); }

.panel {
  margin: auto;
  width: 100%; max-width: 420px;
  display: grid; gap: 14px;
  padding: 22px;
  border-radius: 18px;
  border: 1px solid var(--panel-edge);
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  text-align: center;
}
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 8vw, 48px); line-height: 1.05; color: var(--c, var(--ink)); text-wrap: balance; }
.panel .score { font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.panel .score .r { color: var(--red); }
.panel .score .b { color: var(--blue); }
.panel .opt { text-align: left; }
.btn-row { display: grid; gap: 8px; }
.btn {
  min-height: 46px; padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid var(--panel-edge);
  background: transparent;
  font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
}
.btn.primary { background: var(--ink); color: var(--night); border-color: var(--ink); }

@media (max-height: 560px) {
  .menu-inner { gap: 10px; }
  .logo { font-size: clamp(30px, 8vh, 52px); }
  .tag { font-size: 12px; margin-top: 2px; }
  .mode { padding: 10px 12px; gap: 2px 12px; grid-template-columns: 110px 1fr; }
  .mode svg { grid-row: span 2; align-self: center; margin: 0; }
  .mode-name { font-size: 18px; }
  .mode-desc { font-size: 13px; }
  .mode-go { display: none; }
  .panel { padding: 16px; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #banner.show { animation-duration: .01s; opacity: 1; }
  .mode { transition: none; }
}
</style>

<canvas id="game" aria-label="Air hockey table"></canvas>

<script>
(() => {
'use strict';

// ---------- table geometry, in table units (table width = 1) ----------
// The physics always runs on a vertical table: player 0 (red) defends the goal at y = L,
// player 1 (blue) defends the goal at y = 0. Only the renderer rotates it.
const W = 1, L = 1.75, HALF = L / 2;
const PR = 0.042, MR = 0.068, PU_R = 0.05;
const GOAL_W = 0.36, GX0 = (W - GOAL_W) / 2, GX1 = (W + GOAL_W) / 2;
const RAIL = 0.075, END_ROOM = 56;
const DT = 1 / 240;
const MAX_PULL = 0.3, GUARD_OFF = 0.14;

const CLASSIC = { damp: 0.28, wallE: 0.85, hitE: 0.75, maxPuck: 2.8, humanSpeed: 11 };
const SLING = {
  puckDamp: 1.1, puckFric: 0.25, malDamp: 2.2, malFric: 0.6,
  wallE: 0.82, malWallE: 0.55, hitE: 0.92, malInv: 0.5,
  maxPuck: 5, maxLaunch: 3.3, turbo: 1.45, giant: 1.45,
};
// Classic CPU: top speed, speed when it swings at the puck, how often it re-reads the table, aim error,
// how far off its blocks are, how closely it shadows the puck, and how often it tries a bank shot.
const AIC = {
  easy:   { speed: 1.3, strike: 0.95, react: 0.2,   err: 0.11,  block: 0.14,  track: 0.45, bank: 0.1 },
  medium: { speed: 1.8, strike: 1.2,  react: 0.11,  err: 0.055, block: 0.08,  track: 0.65, bank: 0.25 },
  hard:   { speed: 2.4, strike: 1.5,  react: 0.045, err: 0.02,  block: 0.04,  track: 0.85, bank: 0.4 },
};
// Play-by-play CPU: shots it simulates, then aim and power wobble when it fires.
const AIS = {
  easy:   { n: 26,  ang: 0.12, pow: 0.18, jitter: 30 },
  medium: { n: 80,  ang: 0.06, pow: 0.1,  jitter: 12 },
  hard:   { n: 240, ang: 0.03, pow: 0.06, jitter: 3 },
};
const PU = {
  turbo:  { name: 'Turbo',      desc: 'Next launch hits 50% harder.' },
  giant:  { name: 'Giant',      desc: 'Mallet grows for the next two shots.' },
  shield: { name: 'Shield',     desc: 'A wall covers the goal until it blocks a shot.' },
  double: { name: 'Double',     desc: 'Next goal counts twice.' },
  extra:  { name: 'Extra shot', desc: 'Shoots again after this turn.' },
  ghost:  { name: 'Ghost',      desc: 'Next shot passes straight through the other mallet.' },
};
const PU_WEIGHT = { turbo: 1.2, giant: 1, shield: 1, double: 0.8, extra: 0.8, ghost: 0.9 };
const PU_VALUE = { turbo: 24, giant: 22, shield: 26, double: 28, extra: 34, ghost: 24 };

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

// ---------- settings ----------
const KEY = 'puckrush.settings';
const OPTS = { opponent: ['easy', 'medium', 'hard', '2p'], target: ['3', '5', '7', '10'], orient: ['auto', 'h', 'v'], sound: ['on', 'off'] };
const settings = { opponent: 'medium', target: '5', orient: 'auto', sound: 'on' };
function loadSettings(src) {
  for (const k in OPTS) if (src && OPTS[k].includes(String(src[k]))) settings[k] = String(src[k]);
}
try { loadSettings(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* storage blocked */ }
function saveSettings() { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) { /* storage blocked */ } }

// ---------- colors and fonts come from the CSS tokens ----------
const C = {};
let PC, PD, PS, PUC, FONT_D, FONT_U;
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['night', 'night-hi', 'rail', 'rail-hi', 'ice', 'ice-shade', 'hole', 'gloss', 'gloss-0', 'shadow', 'spec',
    'ink', 'muted', 'red', 'red-deep', 'red-soft', 'blue', 'blue-deep', 'blue-soft', 'puck', 'puck-body', 'line',
    'pu-ink', 'pu-turbo', 'pu-giant', 'pu-shield', 'pu-double', 'pu-extra', 'pu-ghost']) {
    C[k] = cs.getPropertyValue('--' + k).trim();
  }
  PC = [C.red, C.blue]; PD = [C['red-deep'], C['blue-deep']]; PS = [C['red-soft'], C['blue-soft']];
  PUC = {};
  for (const t in PU) PUC[t] = C['pu-' + t];
  FONT_D = cs.getPropertyValue('--font-display').trim();
  FONT_U = cs.getPropertyValue('--font-ui').trim();
}

// ---------- sound (synthesized, starts on first tap or click) ----------
let actx = null, master = null, noiseBuf = null;
const lastSnd = {};
function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
  } catch (e) { actx = null; }
}

// ---------- input ----------
const keys = {};
const ptrs = new Map();
canvas.addEventListener('pointerdown', e => {
  ensureAudio();

  const c = toTable(e.clientX, e.clientY);
  if (game.mode === 'classic') {
    let i = 0;
    if (game.twoP && e.pointerType !== 'mouse') i = c.y < HALF ? 1 : 0;
    ptrs.set(e.pointerId, i);
    steer(i, c);

  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* capture unsupported */ }
  e.preventDefault();

canvas.addEventListener('pointermove', e => {
  if (game.state !== 'playing') return;
  const c = toTable(e.clientX, e.clientY);
  if (game.mode === 'classic') {
    if (ptrs.has(e.pointerId)) steer(ptrs.get(e.pointerId), c);
    else if (e.pointerType === 'mouse') steer(0, c);
  } else {
    slMove(e.pointerId, c);
    if (e.pointerType === 'mouse') {
      const i = game.sl.turn, m = game.m[i];
      let cur = 'default';
      if (game.phase === 'aim' && isHuman(i)) {
        if (game.sl.drag && game.sl.drag.kind === 'aim') cur = 'grabbing';
        else if (Math.hypot(c.x - m.x, c.y - m.y) < m.r + 0.06) cur = 'grab';

canvas.addEventListener('contextmenu', e => e.preventDefault());

  if (e.code === 'Escape' || e.code === 'KeyP') {

function syncSegs() {

  });
}
document.querySelectorAll('.seg').forEach(seg => {
  seg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    ensureAudio();
    settings[seg.dataset.key] = b.dataset.v;
    saveSettings(); syncSegs();
    if (seg.dataset.key === 'orient') layout();
    sfx.tick();
  });
});
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { ensureAudio(); startGame(b.dataset.mode); }));
$('#pauseBtn').addEventListener('click', () => { ensureAudio(); pause(); });
$('#btn-resume').addEventListener('click', resume);
$('#btn-restart').addEventListener('click', () => startGame(game.mode));
$('#btn-quit').addEventListener('click', toMenu);
$('#btn-rematch').addEventListener('click', () => startGame(game.mode));
$('#btn-menu').addEventListener('click', toMenu);

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (game.state === 'playing' || game.state === 'menu') update(dt);
  updateFx(game.state === 'paused' ? 0 : dt);
  render(now / 1000);
}

function boot(data) {
  if (data && data.settings) loadSettings(data.settings);
  readColors();
  syncSegs();
  layout();
  startGame('classic', true);
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readColors(); }).catch(() => {});
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ settings: { ...settings } }));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
